{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Medición</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            background: #fff;
            margin: 80px auto;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        form label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
        }

        form input, form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.2s;
        }

        form input:focus, form select:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0,123,255,0.2);
        }

        button {
            display: block;
            width: 100%;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Registrar Medición</h1>

        <form method="POST">
            {% csrf_token %}
            
            <label for="planta">Planta</label>
            <select id="planta" name="planta" required>
                <option value="">Seleccione una planta</option>
                {% for planta in plantas %}
                    <option value="{{ planta.id_planta }}">{{ planta.nombre_comun }}</option>
                {% endfor %}
            </select>

            <label for="altura_cm">Altura (cm)</label>
            <input type="number" step="0.01" name="altura_cm" id="altura_cm" required>

            <label for="hojas">Número de hojas</label>
            <input type="number" name="hojas" id="hojas" required>

            <label for="luz_horas">Horas de luz</label>
            <input type="number" step="0.1" name="luz_horas" id="luz_horas" required>

            <label for="fecha_registro">Fecha de registro</label>
            <input type="date" name="fecha_registro" id="fecha_registro" required>

            <button type="submit">Guardar Medición</button>
        </form>

        <div class="back-link">
            <a href="{% url 'index' %}">← Volver al inicio</a>
        </div>
    </div>

</body>
</html>
